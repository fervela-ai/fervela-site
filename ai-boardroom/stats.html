<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 董事會 — 下載統計</title>
<meta name="robots" content="noindex">
<style>
  :root{ --navy:#0D1B3D; --teal:#008B8B; --gold:#F5A623; --grey:#6B7280; --mist:#F5F7FA; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:"PingFang TC","Microsoft JhengHei",-apple-system,sans-serif; background:var(--mist); color:#1c2430; line-height:1.75; }
  .wrap{ max-width:560px; margin:0 auto; padding:40px 20px 60px; }
  h1{ font-size:24px; color:var(--navy); margin-bottom:2px; }
  .sub{ color:var(--grey); font-size:13px; margin-bottom:24px; }
  .big{ background:var(--navy); color:#fff; border-radius:16px; padding:22px; text-align:center; margin-bottom:16px; box-shadow:0 2px 10px rgba(13,27,61,.12); }
  .big .n{ font-size:52px; font-weight:800; line-height:1.1; }
  .big .l{ font-size:13px; opacity:.75; letter-spacing:2px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .card{ background:#fff; border:1px solid #dde3ec; border-radius:14px; padding:16px; text-align:center; }
  .card .n{ font-size:32px; font-weight:800; color:var(--navy); }
  .card .l{ font-size:13px; color:var(--grey); }
  table{ width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; font-size:14px; box-shadow:0 2px 10px rgba(13,27,61,.05); }
  th,td{ padding:9px 14px; text-align:right; border-bottom:1px solid #eef1f6; }
  th:first-child,td:first-child{ text-align:left; }
  th{ background:var(--mist); color:var(--navy); font-size:12.5px; }
  .err{ color:#b3261e; background:#fdecea; border-radius:10px; padding:12px 16px; }
  .since{ font-size:11px; color:var(--grey); font-weight:400; }
  .ft{ margin-top:22px; font-size:12px; color:var(--grey); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 AI 董事會 — 下載統計</h1>
  <div class="sub">資料即時來自 GitHub Releases・重新整理即更新</div>
  <div id="out">讀取中…</div>
  <div class="ft">
    此頁僅顯示匿名的下載次數，無任何個人資料。<br>
    ⚠️ 計數綁在「檔案」上：<b>重新上傳同名檔案會從 0 重新計算</b>（表格已標起算日）。<br>
    V2.2 以前是直接傳檔給朋友、沒經過這裡，因此不在統計內。<br>
    © 2026 Fervela.ai
  </div>
</div>
<script>
(async () => {
  const out = document.getElementById("out");
  try {
    const r = await fetch("https://api.github.com/repos/fervela-ai/fervela-site/releases");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rels = await r.json();
    let mac = 0, win = 0, rows = "";
    for (const rel of rels) {
      let m = 0, w = 0;
      for (const a of (rel.assets || [])) {
        if (/mac/i.test(a.name)) m += a.download_count;
        else if (/win/i.test(a.name)) w += a.download_count;
      }
      mac += m; win += w;
      // 顯示「起算日」：GitHub 的下載數綁在「資產檔案」上，重新上傳同名資產會歸零重算。
      const since = (rel.assets && rel.assets[0] ? rel.assets[0].created_at : "").slice(0, 10);
      rows += `<tr><td>${rel.tag_name}<div class="since">起算 ${since}</div></td><td>${m}</td><td>${w}</td><td><b>${m + w}</b></td></tr>`;
    }
    out.innerHTML = `
      <div class="big"><div class="n">${mac + win}</div><div class="l">總下載次數</div></div>
      <div class="duo">
        <div class="card"><div class="n">${mac}</div><div class="l">🍎 Mac</div></div>
        <div class="card"><div class="n">${win}</div><div class="l">🪟 Windows</div></div>
      </div>
      <table><tr><th>版本</th><th>Mac</th><th>Windows</th><th>小計</th></tr>${rows}</table>`;
  } catch (e) {
    out.innerHTML = `<div class="err">讀取失敗（${e.message}）。稍後再試，或 GitHub API 每小時有次數上限。</div>`;
  }
})();
</script>
</body>
</html>
